<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Internet of Growth — Market Ecosystems for the Age of Agents">
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#05070a"/>
      <stop offset="0.38" stop-color="#05070a" stop-opacity="0.98"/>
      <stop offset="0.61" stop-color="#05070a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#05070a" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="0.52" stop-color="#156cff"/>
      <stop offset="1" stop-color="#00b985"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <image xlink:href="og-ecosystem-bg.png" width="1200" height="632" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1200" height="630" fill="url(#shade)"/>
  <rect x="1" y="1" width="1198" height="628" rx="1" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <g transform="translate(64 58)">
    <path d="M0 17c0-9 7-15 16-15 14 0 20 15 31 15 8 0 13-6 13-15" fill="none" stroke="url(#edge)" stroke-width="4" stroke-linecap="round"/>
    <path d="M0 17c0 9 7 15 16 15 14 0 20-15 31-15 8 0 13 6 13 15" fill="none" stroke="url(#edge)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="30" cy="17" r="3" fill="#d9fbff" filter="url(#glow)"/>
    <text x="82" y="25" fill="#ffffff" font-size="27" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="-0.5">Internet of Growth</text>
  </g>

  <g transform="translate(64 193)" font-family="Arial, Helvetica, sans-serif">
    <text fill="#5ce7ff" font-size="16" font-weight="700" letter-spacing="3.4">THE NEW MARKET INFRASTRUCTURE</text>
    <text y="91" fill="#ffffff" font-size="68" font-weight="700" letter-spacing="-3.8">Market Ecosystems</text>
    <text y="169" fill="#ffffff" font-size="58" font-weight="700" letter-spacing="-3.1">for the Age of Agents.</text>
    <text y="231" fill="#c9d2df" font-size="22" font-weight="400" letter-spacing="-0.2">Intelligence coordinates. Value compounds.</text>
  </g>

  <g transform="translate(64 572)">
    <rect width="198" height="2" rx="1" fill="url(#edge)"/>
    <text x="222" y="6" fill="#ffffff" fill-opacity="0.58" font-size="13" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="2.4">INTERNETOFGROWTH.COM</text>
  </g>
</svg>
